name: Daily Instagram post

on:
  schedule:
    # 18:30 UTC = 00:00 IST (next day). Start five minutes early, then wait until 00:05.
    - cron: '30 18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-instagram-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Wait until 12:05 a.m. IST
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import time as sleep

          zone = ZoneInfo("Asia/Kolkata")
          target = datetime.now(zone).replace(
              hour=0, minute=5, second=0, microsecond=0
          )
          now = datetime.now(zone)
          remaining = (target - now).total_seconds()
          if remaining > 0:
              sleep.sleep(remaining)
          # No abort here: however late GitHub started this run, we still
          # want it to post today rather than skip the day entirely.
          PY
      - name: Publish a ten-photo Drive carousel
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
        run: python -m poster
      - name: Save the posted-photo ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/posted.json
          if git diff --cached --quiet; then
            echo "No new photo was posted; ledger is unchanged."
          else
            git commit -m "Record Instagram post"
            git push
          fi
